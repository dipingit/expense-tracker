version: '3.8'

services:
  postgres:
    image: postgres:18.1
    container_name: expense_tracker_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense_tracker_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expense_tracker_api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/expense_tracker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
    networks:
      - expense_tracker_network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: expense_tracker_client
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - expense_tracker_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  expense_tracker_network:
    driver: bridge
